# QEC-Compiler example mirrors
#
# These YAML composites reproduce the gate-level AbstractCircuit output
# of the corresponding QEC-Compiler benchmark builders.
#
# Purpose: verify that pyqres YAML DSL -> generated Python -> AbstractCircuit
# produces the same gate sequence as the QEC-Compiler reference builders.
#
# Limitations:
#   - Qubit indices depend on register allocation order (single-qubit registers
#     allocated in order yield indices 0, 1, 2, ... matching QEC-Compiler).
#   - Measurements and metadata are NOT compared.
#   - These are compiler-only wrappers; PySparQ simulation is not expected.

# GHZ state: H(0) -> CNOT(0,1) -> CNOT(1,2)
# Mirrors: qec_compiler.cases.benchmark_state_prep.build_ghz_circuit(3)
- name: QECExampleGHZ
  description: "GHZ state preparation — mirrors QEC-Compiler build_ghz_circuit"
  qregs:
    - {name: q0, type: General, desc: "Qubit 0 (entangled)"}
    - {name: q1, type: General, desc: "Qubit 1 (entangled)"}
    - {name: q2, type: General, desc: "Qubit 2 (entangled)"}
  params:
    - {name: n, type: int, desc: "Number of qubits (must match register count)"}
  impl:
    - op: Hadamard
      qregs: [q0]
    - op: CNOT
      qregs: [q0, q1]
      params: [0, 0]
    - op: CNOT
      qregs: [q1, q2]
      params: [0, 0]

# Bernstein-Vazirani with secret=0b101 (n=3)
# Mirrors: qec_compiler.cases.benchmark_bv.build_bv_circuit(3, secret=5)
- name: QECExampleBV
  description: "Bernstein-Vazirani (secret=0b101) — mirrors QEC-Compiler build_bv_circuit"
  qregs:
    - {name: q0, type: General, desc: "Input qubit 0"}
    - {name: q1, type: General, desc: "Input qubit 1"}
    - {name: q2, type: General, desc: "Input qubit 2"}
    - {name: anc, type: General, desc: "Ancilla qubit"}
  params:
    - {name: n, type: int, desc: "Number of input qubits"}
  impl:
    # H on all input qubits
    - op: Hadamard
      qregs: [q0]
    - op: Hadamard
      qregs: [q1]
    - op: Hadamard
      qregs: [q2]
    # Oracle: CNOT from qubit i to ancilla where secret bit = 1
    # secret = 0b101 -> bits [1, 0, 1] -> CNOT(q0, anc), CNOT(q2, anc)
    - op: CNOT
      qregs: [q0, anc]
      params: [0, 0]
    - op: CNOT
      qregs: [q2, anc]
      params: [0, 0]
    # H on all input qubits
    - op: Hadamard
      qregs: [q0]
    - op: Hadamard
      qregs: [q1]
    - op: Hadamard
      qregs: [q2]
